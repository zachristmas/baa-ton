id = "herdr-orchestrator-controller"
name = "herdr-orchestrator-controller"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Durable, root-only event controller for Herdr Orchestrator workflows."
platforms = ["linux", "macos", "windows"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "supervisor.sh"]

[[startup]]
platforms = ["windows"]
command = ["node", "controller.mjs", "supervisor"]

[[actions]]
id = "configure-sidebar"
title = "Install / repair Baa-ton sidebar rows"
command = ["sh", "-c", "node \"$HERDR_PLUGIN_ROOT/sidebar-configure.mjs\" --apply && herdr server reload-config"]

# Startup hooks do not run when an already-running server enables a plugin.
# Keep explicit activation foregrounded in a Herdr-owned pane, not a detached job.
[[panes]]
id = "supervisor"
title = "Baa-ton controller supervisor"
placement = "tab"
command = ["node", "controller.mjs", "supervisor"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "controller.mjs", "hook"]
