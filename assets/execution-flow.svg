<svg xmlns="http://www.w3.org/2000/svg" width="760" height="990" viewBox="0 0 760 990" role="img" aria-labelledby="title desc">
  <title id="title">Baa-ton execution path</title>
  <desc id="desc">A request passes from dot through the host application handoff to a local Codex executor and Baa-ton CLI or stdio MCP. Baa-ton reaches native HERDR locally or uses native SSH to a prepared host-local Baa-ton CLI and HERDR runtime.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11 Z" fill="#7160bd"/>
    </marker>
    <style>
      .card { fill: #f7f4ff; stroke: #8b78d3; stroke-width: 2; rx: 16; }
      .primary { fill: #eee9ff; stroke: #7159c6; stroke-width: 3; rx: 18; }
      .label { fill: #28213a; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #574b78; font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #7160bd; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #a697de; stroke-width: 3; }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="990" rx="24" fill="#fff"/>

  <rect class="card" x="280" y="30" width="200" height="66"/>
  <text class="label" x="380" y="72">dot</text>
  <path class="edge" d="M380 96 V150"/>
  <text class="small" x="490" y="130">host app handoff</text>

  <rect class="card" x="215" y="160" width="330" height="78"/>
  <text class="label" x="380" y="207">Local Codex executor</text>
  <path class="edge" d="M380 238 V285"/>

  <rect class="primary" x="175" y="295" width="410" height="100"/>
  <text class="label" x="380" y="338">Baa-ton CLI / stdio MCP</text>
  <text class="small" x="380" y="370">scoped goals · workers · evidence</text>

  <path class="branch" d="M380 395 V435 M185 435 H575 M185 435 V480 M575 435 V480"/>
  <path class="edge" d="M185 435 V480"/>
  <path class="edge" d="M575 435 V480"/>
  <rect class="card" x="30" y="490" width="310" height="78"/>
  <text class="label" x="185" y="537">Native HERDR</text>
  <path class="edge" d="M185 568 V625"/>
  <rect class="card" x="30" y="635" width="310" height="86"/>
  <text class="label" x="185" y="671">Authorized local</text>
  <text class="label" x="185" y="701">workspace</text>

  <rect class="card" x="420" y="490" width="310" height="84"/>
  <text class="label" x="575" y="526">Native SSH</text>
  <text class="small" x="575" y="553">to prepared host runtime</text>
  <path class="edge" d="M575 574 V620"/>
  <rect class="card" x="420" y="625" width="310" height="78"/>
  <text class="label" x="575" y="672">Remote Baa-ton CLI</text>
  <path class="edge" d="M575 703 V745"/>
  <rect class="card" x="420" y="750" width="310" height="78"/>
  <text class="label" x="575" y="797">Native HERDR</text>
  <path class="edge" d="M575 828 V865"/>
  <rect class="card" x="420" y="875" width="310" height="86"/>
  <text class="label" x="575" y="911">Authorized remote</text>
  <text class="label" x="575" y="941">workspace</text>
</svg>
